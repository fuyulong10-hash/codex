name: artifact-test
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create test artifact
        run: |
          mkdir -p out
          echo 'artifact transfer test' > out/hello.txt
          cd out && zip -r ../artifact-test.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-test
          path: artifact-test.zip
