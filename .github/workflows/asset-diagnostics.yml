name: asset-diagnostics
on:
  pull_request:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: pip install beautifulsoup4
      - name: Fetch and inspect source assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diag
          UA='ThreeGorgesOfflinePackageBuilder/1.0 asset-audit'
          curl -fL --retry 3 -A "$UA" https://api.polyhaven.com/files/dam_wall -o diag/poly_dam_wall.json
          curl -fL --retry 3 -A "$UA" https://api.polyhaven.com/files/concrete -o diag/poly_concrete.json
          curl -fL --retry 3 -A "$UA" https://api.polyhaven.com/files/rock_07 -o diag/poly_rock_07.json
          curl -fL --retry 3 -A "$UA" 'https://ambientcg.com/get?file=Concrete007_1K-JPG.zip' -o diag/Concrete007_1K-JPG.zip
          curl -fL --retry 3 -A "$UA" 'https://kenney.nl/media/pages/assets/watercraft-kit/a335cfed49-1713519620/kenney_watercraft-pack.zip' -o diag/kenney_watercraft-pack.zip
          curl -fL --retry 3 -A "$UA" https://quaternius.com/packs/ships.html -o diag/quaternius_ships_page.html
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json, zipfile
          d=Path('diag')
          for name in ['poly_dam_wall.json','poly_concrete.json','poly_rock_07.json']:
              obj=json.loads((d/name).read_text())
              rows=[]
              def walk(x,p=()):
                  if isinstance(x,dict):
                      if isinstance(x.get('url'),str): rows.append(('/'.join(p),x['url'],x.get('size'),x.get('md5'),x.get('include')))
                      for k,v in x.items(): walk(v,p+(str(k),))
                  elif isinstance(x,list):
                      for i,v in enumerate(x): walk(v,p+(str(i),))
              walk(obj)
              (d/(name+'.urls.txt')).write_text('\n'.join(f'{p}\t{u}\t{s}\t{m}\t{inc}' for p,u,s,m,inc in rows))
          for zname in ['Concrete007_1K-JPG.zip','kenney_watercraft-pack.zip']:
              with zipfile.ZipFile(d/zname) as z:
                  (d/(zname+'.listing.txt')).write_text('\n'.join(f'{i.file_size}\t{i.filename}' for i in z.infolist()))
          html=(d/'quaternius_ships_page.html').read_text(errors='replace')
          soup=BeautifulSoup(html,'html.parser')
          links=[(a.get_text(' ',strip=True),a['href']) for a in soup.find_all('a',href=True)]
          scripts=[s.get('src') for s in soup.find_all('script') if s.get('src')]
          (d/'quaternius_links.txt').write_text('\n'.join(f'{t}\t{h}' for t,h in links)+'\nSCRIPTS\n'+'\n'.join(scripts))
          print((d/'quaternius_links.txt').read_text())
          PY
          ls -lh diag
        env:
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-diagnostics
          path: diag
          if-no-files-found: warn
