name: build-three-gorges-offline-final
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate complete offline package
        shell: bash
        run: |
          : > package-build-final.log
          exec > >(tee -a package-build-final.log) 2>&1
          set -euxo pipefail
          cat package-source/ci_build.sh.gz.b64.part00 package-source/ci_build.sh.gz.b64.part01 package-source/ci_build.sh.gz.b64.part01b package-source/ci_build.sh.gz.b64.part02 package-source/ci_build.sh.gz.b64.part03 package-source/ci_build.sh.gz.b64.part04 | base64 -d | gzip -d > package-source/ci_build.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('package-source/ci_build.sh')
          s=p.read_text()
          s=s.replace('gdown --quiet --id ', 'gdown --quiet ')
          p.write_text(s)
          PY
          python package-source/final_patch.py
          ln -s ../node_modules package-source/node_modules
          chmod +x package-source/ci_build.sh
          bash package-source/ci_build.sh

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Three_Gorges_Offline_Premium_Package_Final
          path: package-source/dist/Three_Gorges_Offline_Premium_Package.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Three_Gorges_Offline_Final_Diagnostics
          path: |
            package-build-final.log
            package-source/dist/Three_Gorges_Offline_Premium/validation/**
          if-no-files-found: warn
          retention-days: 7
