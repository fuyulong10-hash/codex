name: build-three-gorges-offline
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and run package builder
        shell: bash
        run: |
          : > package-build.log
          exec > >(tee -a package-build.log) 2>&1
          set -euxo pipefail
          cat package-source/ci_build.sh.gz.b64.part00 | base64 -d | gzip -d > package-source/ci_build.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('package-source/ci_build.sh')
          s=p.read_text()
          s=s.replace('cd "$(git rev-parse --show-toplevel)"','REPO_ROOT="$(git rev-parse --show-toplevel)"\ncd "$REPO_ROOT"',1)
          s=s.replace("echo '===== ","cd \"$REPO_ROOT\"\n\necho '===== ")
          s=s.replace('"},12000);", "},30000);", 1)','"},12000);", "},120000);", 1)')
          p.write_text(s)
          PY
          chmod +x package-source/ci_build.sh
          set +e
          bash package-source/ci_build.sh
          status=$?
          exit $status

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Three_Gorges_Offline_Premium_Package
          path: package-source/dist/Three_Gorges_Offline_Premium_Package.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Three_Gorges_Offline_Build_Diagnostics
          path: |
            package-build.log
            package-source/ci_build.sh
            package-source/dist/Three_Gorges_Offline_Premium/validation/**
          if-no-files-found: error
          retention-days: 7
