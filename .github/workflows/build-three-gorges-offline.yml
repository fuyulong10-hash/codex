name: build-three-gorges-offline
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and run package builder
        shell: bash
        run: |
          : > package-build.log
          exec > >(tee -a package-build.log) 2>&1
          set -euxo pipefail
          ls -l package-source/ci_build.sh.gz.b64.part00 package-source/ci_build.sh.gz.b64.part01 package-source/ci_build.sh.gz.b64.part02 package-source/ci_build.sh.gz.b64.part03 package-source/ci_build.sh.gz.b64.part04
          cat package-source/ci_build.sh.gz.b64.part00 package-source/ci_build.sh.gz.b64.part01 package-source/ci_build.sh.gz.b64.part02 package-source/ci_build.sh.gz.b64.part03 package-source/ci_build.sh.gz.b64.part04 | base64 -d | gzip -d > package-source/ci_build.sh
          chmod +x package-source/ci_build.sh
          set +e
          bash package-source/ci_build.sh
          status=$?
          exit $status

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Three_Gorges_Offline_Premium_Package
          path: package-source/dist/Three_Gorges_Offline_Premium_Package.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Three_Gorges_Offline_Build_Diagnostics
          path: |
            package-build.log
            package-source/ci_build.sh
            package-source/dist/Three_Gorges_Offline_Premium/validation/**
          if-no-files-found: error
          retention-days: 7
